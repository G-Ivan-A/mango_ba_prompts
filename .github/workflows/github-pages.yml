name: GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static data
        run: node scripts/generate-pages-data.mjs

      - name: Validate issue #123 runs contract
        run: python3 scripts/validate_issue_123_runs_contract.py

      - name: Validate issue #133 runs restructure
        run: python3 scripts/validate_issue_133_runs_restructure.py

      - name: Validate issue #217 runs log contract
        run: python3 scripts/validate_issue_217_runs_log_contract.py

      - name: Validate issue #125 cascading context loading
        run: python3 scripts/validate_issue_125_cascading_context.py

      - name: Validate issue #134 README standard
        run: python3 scripts/validate_issue_134_readme_standard.py

      - name: Validate issue #127 Hub RFC sync
        run: python3 scripts/validate_issue_127_hub_rfc_sync.py

      - name: Validate issue #193 approval contract
        run: python3 scripts/validate_issue_193_approval_contract.py

      - name: Validate issue #196 BCREQ-FR generation contract
        run: python3 scripts/validate_issue_196_bcreq_fr_contract.py

      - name: Validate issue #208 BCREQ-FR L3 boundary
        run: python3 scripts/validate_issue_208_bcreq_fr_l3_boundary.py

      - name: Validate issue #215 BCREQ-FR YAML contract
        run: python3 scripts/validate_issue_215_bcreq_fr_yaml_contract.py

      - name: Validate issue #219 RUN-0012 BCREQ-FR scope
        run: python3 scripts/validate_issue_219_bcreq_fr_scope.py

      - name: Validate issue #211 Golden Examples contract
        run: python3 scripts/validate_issue_211_golden_examples_contract.py

      - name: Validate issue #212 executable contract standard
        run: python3 scripts/validate_issue_212_executable_contract_standard.py

      - name: Validate issue #225 artifact chain research
        run: python3 scripts/validate_issue_225_artifact_chain_research.py

      - name: Validate issue #199 BCREQ-1027 section 4.3 API methods
        run: python3 scripts/validate_issue_199_bcreq_1027_section_4_3.py

      - name: Validate issue #205 BCREQ-1027 runs structure
        run: python3 scripts/validate_issue_205_bcreq_1027_runs_structure.py

      - name: Validate issue #207 BCREQ-1027 VPBX run
        run: python3 scripts/validate_issue_207_bcreq_1027_vpbx_run.py

      - name: Validate Pages artifact
        run: python3 scripts/validate_issue_74_github_pages.py

      - name: Validate Pages enhancements
        run: python3 scripts/validate_issue_91_pages_enhancements.py

      - name: Validate Mango Office widget
        run: python3 scripts/validate_issue_86_mango_widget.py

      - name: Validate prompt ID in copy
        run: python3 scripts/validate_issue_95_prompt_id_in_copy.py

      - name: Validate Pages optimization
        run: python3 scripts/validate_issue_99_pages_optimization.py

      - name: Validate issue #97 ontology and standards
        run: python3 scripts/validate_issue_97_ontology_standards.py

      - name: Validate UI catalog fixes
        run: python3 scripts/validate_issue_103_ui_fixes.py

      - name: Prepare artifact
        run: |
          mkdir -p pages-dist
          rsync -a --delete site/ pages-dist/
          touch pages-dist/.nojekyll

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: update GitHub Pages"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
