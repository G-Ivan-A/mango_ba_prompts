name: GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static data
        run: node scripts/generate-pages-data.mjs

      - name: Validate issue #123 runs contract
        run: python3 scripts/validate_issue_123_runs_contract.py

      - name: Test issue #293 run types and boundaries
        run: python3 scripts/test_runs_contract_run_type.py

      - name: Validate issue #272 RUN-0019 record
        run: python3 scripts/validate_issue_272_run_0019.py

      - name: Validate issue #125 cascading context loading
        run: python3 scripts/validate_issue_125_cascading_context.py

      - name: Validate issue #265 hub sync and link integrity
        run: python3 scripts/validate_issue_265_hub_sync.py

      - name: Validate Pages artifact
        run: python3 scripts/validate_issue_74_github_pages.py

      - name: Validate Pages enhancements
        run: python3 scripts/validate_issue_91_pages_enhancements.py

      - name: Validate Mango Office widget
        run: python3 scripts/validate_issue_86_mango_widget.py

      - name: Validate prompt ID in copy
        run: python3 scripts/validate_issue_95_prompt_id_in_copy.py

      - name: Validate Pages optimization
        run: python3 scripts/validate_issue_99_pages_optimization.py

      - name: Validate issue #97 ontology and standards
        run: python3 scripts/validate_issue_97_ontology_standards.py

      - name: Validate UI catalog fixes
        run: python3 scripts/validate_issue_103_ui_fixes.py

      - name: Validate issue #263 vision alignment
        run: python3 scripts/validate_issue_263_vision_alignment.py

      - name: Prepare artifact
        run: |
          mkdir -p pages-dist
          rsync -a --delete site/ pages-dist/
          touch pages-dist/.nojekyll

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: update GitHub Pages"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
