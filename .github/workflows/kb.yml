name: KB pipeline

# База знаний (issue #111): на каждый PR/push — быстрая проверка деливераблов
# (stdlib-only, без pip, детерминированно). Полный конвейер извлечения PDF
# (pdfplumber/PyMuPDF/tiktoken) запускается ВРУЧНУЮ через workflow_dispatch:
# он тяжелее и зависит от сети для pip, поэтому не должен блокировать обычный CI.
# По умолчанию ручной запуск обрабатывает source manifest mango-cc-manual.
# Это GitHub-native извлечение, которого требует ФТ-2.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Source manifest directory under kb/sources/; leave empty to use raw source/out inputs"
        required: false
        default: "kb/sources/mango-cc-manual"
      source:
        description: "PDF source path(s) under kb/sources/; use spaces for multi-part manuals"
        required: false
        default: "kb/sources/mango-cc-manual/CC_manual_1.26.23-part-1.pdf kb/sources/mango-cc-manual/CC_manual_1.26.23-part-2.pdf kb/sources/mango-cc-manual/CC_manual_1.26.23-part-3.pdf kb/sources/mango-cc-manual/CC_manual_1.26.23-part-4.pdf kb/sources/mango-cc-manual/CC_manual_1.26.23-part-5.pdf kb/sources/mango-cc-manual/CC_manual_1.26.23-part-6.pdf"
      out:
        description: "Artifact/output directory under kb/processed/ (set to collection dir for source_dir runs)"
        required: true
        default: "kb/processed/mango-cc-manual"
      doc_code:
        description: "Short document code for citations"
        required: true
        default: "CC"
      doc_title:
        description: "Document title for index/meta"
        required: true
        default: "Контакт-центр MANGO OFFICE - Руководство пользователя"
      doc_version:
        description: "Document version"
        required: true
        default: "1.26.23"
      note:
        description: "Extraction note stored in meta.json"
        required: false
        default: "Manual GitHub Actions extraction"
      commit_result:
        description: "Commit generated kb/processed output back to the current branch"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

concurrency:
  group: kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Лёгкая проверка на каждый PR/push — никаких зависимостей, только stdlib.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate KB pipeline
        run: |
          python3 scripts/validate_issue_111_kb_pipeline.py
          python3 scripts/validate_issue_115_kb_mango_pipeline.py
          python3 scripts/validate_issue_117_kb_traceability.py
          python3 scripts/validate_issue_121_kb_multi_file.py

  # Тяжёлый сквозной прогон извлечения — только по ручному запуску.
  # Доказывает воспроизводимость конвейера в GitHub-native среде (ФТ-2):
  # source → extract.py → kb/processed/<slug> → проверка. Результат всегда
  # выкладывается артефактом; при commit_result=true также коммитится в ветку.
  extract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: pip install -r scripts/kb/requirements.txt

      - name: Extract requested source
        run: |
          if [ -n "${{ inputs.source_dir }}" ]; then
            python3 scripts/kb/process_sources.py "${{ inputs.source_dir }}"
          else
            make kb-extract \
              SRCS="${{ inputs.source }}" \
              OUT="${{ inputs.out }}" \
              CODE="${{ inputs.doc_code }}" \
              TITLE="${{ inputs.doc_title }}" \
              VERSION="${{ inputs.doc_version }}" \
              NOTE="${{ inputs.note }}"
          fi

      - name: Validate extracted KB
        run: make kb-validate

      - name: Show token footprint (index vs sections)
        run: |
          if [ -d "${{ inputs.out }}/sections" ]; then
            make kb-tokens OUT="${{ inputs.out }}"
          else
            echo "Skipping token footprint: ${{ inputs.out }}/sections not found."
          fi

      - name: Upload extracted KB artifact
        uses: actions/upload-artifact@v7
        with:
          name: kb-processed
          path: ${{ inputs.out }}/
          if-no-files-found: error

      - name: Commit extracted KB
        if: ${{ inputs.commit_result == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ inputs.source_dir }}" ]; then
            git add kb/processed
          else
            git add "${{ inputs.out }}"
          fi
          if git diff --cached --quiet; then
            echo "No generated KB changes to commit."
          else
            git commit -m "chore(kb): extract ${{ inputs.out }}"
            git push
          fi
