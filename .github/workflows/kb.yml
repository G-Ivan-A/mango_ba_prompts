name: KB pipeline

# База знаний (issue #111/#131): PR проверяет закоммиченные деливераблы,
# а push в main с изменениями источников/конвейера автоматически запускает
# полный manifest-driven extract и коммитит kb/mango-product-docs/processed обратно в ветку.
# Ручной workflow_dispatch остаётся способом переизвлечь все или один source.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kb.yml"
      - "CHANGELOG.md"
      - "Makefile"
      - "docs/audit/issue-144-kb-structure.md"
      - "kb/README.md"
      - "kb/fragments/README.md"
      - "kb/practices/**"
      - "kb/mango-product-docs/README.md"
      - "kb/mango-product-docs/UPLOAD-GUIDE.md"
      - "kb/mango-product-docs/sources/**"
      - "scripts/kb/**"
      - "scripts/validate_issue_*_kb*.py"
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Source manifest directory under kb/mango-product-docs/sources/; use 'all' for every meta.json; leave empty to use raw source/out inputs"
        required: false
        default: "all"
      source:
        description: "PDF source path(s) under kb/mango-product-docs/sources/; use spaces for multi-part manuals"
        required: false
        default: "kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-1.pdf kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-2.pdf kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-3.pdf kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-4.pdf kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-5.pdf kb/mango-product-docs/sources/mango-cc-manual/CC_manual_1.26.23-part-6.pdf"
      out:
        description: "Artifact/output directory under kb/mango-product-docs/processed/ (used for raw runs and artifact upload)"
        required: true
        default: "kb/mango-product-docs/processed/mango-cc-manual"
      doc_code:
        description: "Short document code for citations"
        required: true
        default: "CC"
      doc_title:
        description: "Document title for index/meta"
        required: true
        default: "Контакт-центр MANGO OFFICE - Руководство пользователя"
      doc_version:
        description: "Document version"
        required: true
        default: "1.26.23"
      note:
        description: "Extraction note stored in meta.json"
        required: false
        default: "Manual GitHub Actions extraction"
      commit_result:
        description: "Commit generated kb/mango-product-docs/processed output back to the current branch"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: write

concurrency:
  group: kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Лёгкая проверка на каждый PR/push — никаких зависимостей, только stdlib.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate KB pipeline
        run: |
          python3 scripts/validate_issue_111_kb_pipeline.py
          python3 scripts/validate_issue_115_kb_mango_pipeline.py
          python3 scripts/validate_issue_117_kb_traceability.py
          python3 scripts/validate_issue_121_kb_multi_file.py
          python3 scripts/validate_issue_129_kb_all_sources.py
          python3 scripts/validate_issue_137_kb_product_docs_migration.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/validate_issue_131_kb_processed_outputs.py
          else
            echo "Issue #131 processed-output validation runs after extraction for ${{ github.event_name }}."
          fi

      - name: Validate issue #144 KB structure README integrity
        run: python3 scripts/validate_issue_144_kb_structure_readmes.py

      - name: Validate issue #146 Mango taxonomy validation
        run: python3 scripts/validate_issue_146_mango_taxonomy.py

      - name: Validate issue #148 taxonomy extensions
        run: python3 scripts/validate_issue_148_taxonomy_extensions.py

      - name: Validate issue #152 Industry Taxonomy standard
        run: python3 scripts/validate_issue_152_industry_taxonomy_standard.py

      - name: Validate issue #154 Mango Taxonomy standard
        run: python3 scripts/validate_issue_154_mango_taxonomy_standard.py

  # Тяжёлый сквозной прогон извлечения.
  # На workflow_dispatch выполняет выбранный source. На push в main всегда
  # обрабатывает все kb/mango-product-docs/sources/*/meta.json и коммитит kb/mango-product-docs/processed.
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: pip install -r scripts/kb/requirements.txt

      - name: Extract requested source
        run: |
          SOURCE_DIR="${{ inputs.source_dir }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            SOURCE_DIR="all"
          fi
          if [ "$SOURCE_DIR" = "all" ]; then
            python3 scripts/kb/process_sources.py --all
          elif [ -n "$SOURCE_DIR" ]; then
            python3 scripts/kb/process_sources.py "$SOURCE_DIR"
          else
            make kb-extract \
              SRCS="${{ inputs.source }}" \
              OUT="${{ inputs.out }}" \
              CODE="${{ inputs.doc_code }}" \
              TITLE="${{ inputs.doc_title }}" \
              VERSION="${{ inputs.doc_version }}" \
              NOTE="${{ inputs.note }}"
          fi

      - name: Validate extracted KB
        run: make kb-validate

      - name: Show token footprint (index vs sections)
        run: |
          OUT_DIR="${{ inputs.out }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -d "$OUT_DIR/sections" ]; then
            make kb-tokens OUT="$OUT_DIR"
          else
            echo "Skipping token footprint: no single document output selected."
          fi

      - name: Upload extracted KB artifact
        uses: actions/upload-artifact@v7
        with:
          name: kb-processed
          path: kb/mango-product-docs/processed/
          if-no-files-found: error

      - name: Commit extracted KB
        if: ${{ github.event_name == 'push' || github.event.inputs.commit_result == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/mango-product-docs/processed
          if git diff --cached --quiet; then
            echo "No generated KB changes to commit."
          else
            SOURCE_LABEL="${{ inputs.source_dir }}"
            if [ "${{ github.event_name }}" = "push" ]; then
              SOURCE_LABEL="all source manifests"
            elif [ -z "$SOURCE_LABEL" ]; then
              SOURCE_LABEL="${{ inputs.out }}"
            fi
            git commit -m "chore(kb): extract ${SOURCE_LABEL}"
            git push
          fi
