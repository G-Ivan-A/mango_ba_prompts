name: Validate governance

# Валидаторы Хаба (issue #267): frontmatter и именование хронологических
# артефактов; замок на базовую структуру HTOM-команды (issue #291). Скрипты —
# рабочие копии/адаптации из hybrid-Intelligence-lab, локальные дельты описаны
# в tools/README.md. Проверка лёгкая (bash + coreutils), поэтому
# запускается на каждый PR и push в main.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frontmatter, file naming and repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontmatter (root, ai-rules/, tools/)
        run: make validate-frontmatter
      - name: Validate file naming
        run: make validate-file-naming
      - name: Validate repository structure
        run: make validate-structure
      - name: Validate onboarding protocol navigation (issue #267)
        run: make validate-onboarding

  validate-all:
    name: All validators (full level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Единая точка входа (issue #299): раннер сам обнаруживает валидаторы по
      # маске, поэтому новый валидатор попадает в CI без правки workflow.
      # `--full` игнорирует кэш: в CI дерево всегда холодное.
      - name: Run every discovered validator
        run: make validate-full
